<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ระบบออกใบเสร็จรับเงิน</title>
  <script src="supabase-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{--p:#2457a6;--g:#0f8b73;--d:#c63030;--bg:#f3f6fb;--line:#d8dee8;--ink:#172033;--muted:#667085;--paper:#fff}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Tahoma,'Noto Sans Thai',Arial,sans-serif;line-height:1.45}button,input,select,textarea{font:inherit}button{border:0;cursor:pointer}.hidden{display:none!important}
    .top{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line);padding:12px 24px;display:flex;gap:14px;align-items:center;justify-content:space-between}.brand{display:flex;gap:12px;align-items:center;min-width:0}.brand img{width:48px;height:48px;object-fit:contain}.brand strong{display:block;font-size:18px}.brand span{display:block;color:var(--muted);font-size:12px}.wrap{width:min(1220px,100%);margin:0 auto;padding:22px}.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:16px;box-shadow:0 8px 24px rgba(28,43,65,.08)}.hero{min-height:calc(100vh - 92px);display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:center}.hero h1{font-size:clamp(32px,4vw,54px);line-height:1.08;margin:0 0 10px}.hero p{color:#435062;font-size:17px}.grid{display:grid;gap:12px}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.four{grid-template-columns:repeat(4,minmax(0,1fr))}label{font-size:13px;font-weight:700;display:grid;gap:5px}input,select,textarea{width:100%;min-height:40px;border:1px solid #cfd7e4;border-radius:7px;padding:8px 10px;background:#fff}textarea{min-height:80px}.btn{min-height:38px;border-radius:7px;padding:8px 13px;background:var(--p);color:#fff;font-weight:700}.btn.g{background:var(--g)}.btn.d{background:var(--d)}.btn.s{background:#e8edf5;color:#223149}.btn:disabled{opacity:.5;cursor:not-allowed}.entry{min-height:130px;text-align:left;color:#fff;border-radius:10px;padding:18px;display:flex;flex-direction:column;justify-content:space-between}.entry.admin{background:linear-gradient(135deg,#2457a6,#173b75)}.entry.user{background:linear-gradient(135deg,#0f8b73,#09614f)}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:12px}.tab{background:#fff;border:1px solid var(--line);border-radius:7px;padding:9px 13px;font-weight:700}.tab.active{background:var(--p);color:#fff;border-color:var(--p)}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.right{margin-left:auto}.pill{display:inline-flex;border-radius:99px;padding:3px 9px;background:#eef4ff;color:#193f7d;font-size:12px;font-weight:700}.pill.bad{background:#ffeaea;color:var(--d)}.table{overflow:auto;border:1px solid var(--line);border-radius:8px}.table table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{border-bottom:1px solid #e4e9f1;padding:9px 8px;text-align:left;vertical-align:top}.table th{background:#f8fafc;color:#475467}.stat{background:#f9fbff;border:1px solid #dce4ee;border-radius:8px;padding:14px}.stat span{font-size:12px;color:var(--muted);font-weight:700}.stat strong{display:block;font-size:25px}.status{font-weight:800;color:var(--g);min-height:24px}.status.err{color:var(--d)}
    .receipt{width:148mm;min-height:210mm;background:#fff;color:#000;margin:12px auto;padding:12mm;box-shadow:0 8px 25px rgba(0,0,0,.16);font-family:'TH Sarabun New',Tahoma,sans-serif}.receipt h2{text-align:center;margin:0}.receipt .head{text-align:center}.receipt table{width:100%;border-collapse:collapse;margin-top:10mm}.receipt th,.receipt td{border:1px solid #000;padding:6px}.amount{text-align:right}.modal{position:fixed;inset:0;background:rgba(14,24,37,.58);display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modal.open{display:flex}.modal .card{width:min(520px,100%)}
    @media(max-width:820px){.hero,.two,.three,.four{grid-template-columns:1fr}.top{padding:10px 14px}.wrap{padding:14px}.brand strong{font-size:15px}.receipt{width:100%;min-height:auto}}
    @media print{body{background:#fff}.top,.wrap>.card:not(.printable),.tabs,.no-print{display:none!important}.wrap{padding:0}.receipt{box-shadow:none;margin:0;width:148mm;min-height:210mm}}
  </style>
</head>
<body>
<div class="top">
  <div class="brand"><img src="university-logo.svg" alt="logo"><div><strong>ระบบออกใบเสร็จรับเงิน</strong><span>มหาวิทยาลัยเทคโนโลยีราชมงคลสุวรรณภูมิ</span></div></div>
  <div class="row"><span id="modePill" class="pill">กำลังโหลด</span><button id="reloadBtn" class="btn s hidden">โหลดใหม่</button><button id="logoutBtn" class="btn s hidden">ออกจากระบบ</button></div>
</div>
<main class="wrap">
  <section id="loginPage" class="hero">
    <div><h1>ฐานข้อมูลกลาง ออกใบเสร็จแบบไม่ซ้ำ</h1><p>Admin ใช้ Username/Password แบบไม่ต้องใช้อีเมล ส่วน User เข้าด้วยรหัส 4 หลักที่ Admin สร้าง ข้อมูลอัปเดตได้หลายเครื่องผ่าน Supabase Realtime</p></div>
    <div class="card">
      <div class="grid two"><button class="entry admin" onclick="showLogin('admin')"><span>🔐</span><strong>Admin</strong><small>Username: admin / Password: 9999</small></button><button class="entry user" onclick="showLogin('user')"><span>🧾</span><strong>User</strong><small>กรอกรหัส 4 หลัก</small></button></div>
      <div id="adminLogin" class="grid hidden" style="margin-top:16px"><label>Username<input id="adminUser" value="admin" autocomplete="username"></label><label>Password<input id="adminPass" type="password" value="9999" autocomplete="current-password"></label><button class="btn" onclick="loginAdmin()">เข้าสู่ระบบ Admin</button></div>
      <div id="userLogin" class="grid hidden" style="margin-top:16px"><label>รหัส User 4 หลัก<input id="userCode" maxlength="4" inputmode="numeric" placeholder="เช่น 1001"></label><button class="btn g" onclick="loginUser()">เข้าสู่ระบบ User</button></div>
      <div id="loginStatus" class="status"></div>
    </div>
  </section>

  <section id="appPage" class="hidden">
    <div class="card no-print"><div class="row"><h2 id="pageTitle" style="margin:0">ระบบ</h2><span id="who" class="pill"></span><span class="right status" id="status"></span></div></div>
    <div id="adminArea" class="hidden"></div>
    <div id="userArea" class="hidden"></div>
    <div id="printArea"></div>
  </section>
</main>

<div id="cancelModal" class="modal"><div class="card"><h3>ยกเลิกใบเสร็จ</h3><p id="cancelText"></p><label>หมายเหตุ<textarea id="cancelReason" placeholder="ระบุเหตุผล"></textarea></label><div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn s" onclick="closeCancel()">ปิด</button><button class="btn d" onclick="confirmCancel()">ยืนยันยกเลิก</button></div></div></div>

<script>
const DEFAULT_STATE={admin:{username:'admin',password:'9999'},users:[],titles:['นาย','นาง','นางสาว','ดร.','ผู้ช่วยศาสตราจารย์'],paymentItems:['ค่าลงทะเบียน','ค่าธรรมเนียมการศึกษา','ค่าบำรุงการศึกษา','ค่าปรับ'],projects:[{name:'โครงการบริการวิชาการ',active:true},{name:'โครงการอบรมระยะสั้น',active:true},{name:'ศูนย์พระนครศรีอยุธยา หันตรา',active:true},{name:'ไม่ระบุโครงการ',active:true}],payerBanks:['ธนาคารกรุงไทย','ธนาคารไทยพาณิชย์','ธนาคารกสิกรไทย','ธนาคารกรุงเทพ'],universityBanks:[{bank:'ธนาคารกรุงไทย',accountName:'มหาวิทยาลัยเทคโนโลยีราชมงคลสุวรรณภูมิ',accountNo:'123-4-56789-0'}],books:[{bookNo:'2567A',start:1,end:500,latest:0,active:true,closed:false}],receipts:[]};
let state=structuredClone(DEFAULT_STATE),role=null,currentUser=null,activeTab='dashboard',supa=null,realtime=null,cancelTarget=null;
const $=id=>document.getElementById(id);const money=n=>Number(n||0).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});const today=()=>new Date().toISOString().slice(0,10);const esc=s=>String(s??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]));
function status(msg,err=false){$('status').textContent=msg||'';$('status').className=err?'status err':'status'}
function loginStatus(msg,err=false){$('loginStatus').textContent=msg||'';$('loginStatus').className=err?'status err':'status'}
function cfg(){return window.RECEIPT_APP_SUPABASE||{url:'',anonKey:''}}
function supabaseOn(){const c=cfg();return !!(c.url&&c.anonKey&&window.supabase)}
async function init(){if(supabaseOn()){supa=window.supabase.createClient(cfg().url,cfg().anonKey);$('modePill').textContent='Supabase กลาง + Realtime';await loadState();subscribeRealtime()}else{$('modePill').textContent='LocalStorage เครื่องนี้';await loadState()}$('reloadBtn').onclick=async()=>{await loadState();render()};$('logoutBtn').onclick=logout;$('reloadBtn').classList.remove('hidden')}
function normalize(s){s={...structuredClone(DEFAULT_STATE),...(s||{})};s.admin={username:'admin',password:'9999'};for(const k of ['users','titles','paymentItems','projects','payerBanks','universityBanks','books','receipts'])if(!Array.isArray(s[k]))s[k]=structuredClone(DEFAULT_STATE[k]);return s}
async function loadState(silent=false){try{if(supa){const {data,error}=await supa.rpc('get_app_state');if(error)throw error;state=normalize(data)}else{state=normalize(JSON.parse(localStorage.getItem('receiptAppState')||'null'))}if(!silent)loginStatus('โหลดข้อมูลเรียบร้อย')}catch(e){loginStatus(e.message||'โหลดข้อมูลไม่สำเร็จ',true);state=normalize(state)}}
async function saveState(){state=normalize(state);if(supa){const {data,error}=await supa.rpc('save_app_state',{p_username:'admin',p_password:'9999',p_data:state});if(error)throw error;state=normalize(data.state)}else{localStorage.setItem('receiptAppState',JSON.stringify(state))}}
function subscribeRealtime(){if(!supa||realtime)return;realtime=supa.channel('receipt-app-state').on('postgres_changes',{event:'*',schema:'public',table:'app_state'},async()=>{await loadState(true);render()}).subscribe()}
function showLogin(t){$('adminLogin').classList.toggle('hidden',t!=='admin');$('userLogin').classList.toggle('hidden',t!=='user');loginStatus('')}
async function loginAdmin(){await loadState(true);if($('adminUser').value.trim()==='admin'&&$('adminPass').value==='9999'){role='admin';currentUser={name:'Admin',code:'admin'};openApp()}else loginStatus('Username หรือ Password ไม่ถูกต้อง',true)}
async function loginUser(){await loadState(true);const code=$('userCode').value.trim();const u=state.users.find(x=>String(x.code)===code);if(/^\d{4}$/.test(code)&&u){role='user';currentUser=u;openApp()}else loginStatus('ไม่พบรหัส User 4 หลักนี้',true)}
function openApp(){$('loginPage').classList.add('hidden');$('appPage').classList.remove('hidden');$('logoutBtn').classList.remove('hidden');render()}
function logout(){role=null;currentUser=null;$('appPage').classList.add('hidden');$('loginPage').classList.remove('hidden');$('logoutBtn').classList.add('hidden');$('adminArea').innerHTML='';$('userArea').innerHTML='';$('printArea').innerHTML=''}
function render(){if(!role)return;$('pageTitle').textContent=role==='admin'?'Admin หลังบ้าน':'User ออกใบเสร็จ';$('who').textContent=role==='admin'?'Admin':'User '+currentUser.code+' '+(currentUser.name||'');$('adminArea').classList.toggle('hidden',role!=='admin');$('userArea').classList.toggle('hidden',role!=='user');role==='admin'?renderAdmin():renderUser()}
function tabs(){return ['dashboard','users','books','receipts','lists'].map(([id,label])=>`<button class="tab ${activeTab===id?'active':''}" onclick="activeTab='${id}';renderAdmin()">${label||id}</button>`).join('').replace('dashboard','ภาพรวม').replace('users','User').replace('books','เล่มใบเสร็จ').replace('receipts','รายงาน').replace('lists','รายการตั้งต้น')}
function renderAdmin(){let html=`<div class="tabs no-print"><button class="tab ${activeTab==='dashboard'?'active':''}" onclick="activeTab='dashboard';renderAdmin()">ภาพรวม</button><button class="tab ${activeTab==='users'?'active':''}" onclick="activeTab='users';renderAdmin()">User</button><button class="tab ${activeTab==='books'?'active':''}" onclick="activeTab='books';renderAdmin()">เล่มใบเสร็จ</button><button class="tab ${activeTab==='receipts'?'active':''}" onclick="activeTab='receipts';renderAdmin()">รายงาน</button><button class="tab ${activeTab==='lists'?'active':''}" onclick="activeTab='lists';renderAdmin()">รายการตั้งต้น</button></div>`;
 if(activeTab==='dashboard')html+=adminDashboard();if(activeTab==='users')html+=adminUsers();if(activeTab==='books')html+=adminBooks();if(activeTab==='receipts')html+=receiptTable(state.receipts,true);if(activeTab==='lists')html+=adminLists();$('adminArea').innerHTML=html}
function adminDashboard(){const paid=state.receipts.filter(r=>r.status!=='ยกเลิก');const sum=paid.reduce((a,r)=>a+Number(r.amount||0),0);const active=state.books.find(b=>b.active&&!b.closed);return `<div class="grid four"><div class="stat"><span>ใบเสร็จทั้งหมด</span><strong>${state.receipts.length}</strong></div><div class="stat"><span>ยอดชำระ</span><strong>${money(sum)}</strong></div><div class="stat"><span>User</span><strong>${state.users.length}</strong></div><div class="stat"><span>เล่มปัจจุบัน</span><strong>${active?esc(active.bookNo):'-'}</strong></div></div>`+receiptTable(state.receipts.slice(-8).reverse(),true)}
function adminUsers(){return `<div class="card"><h3>สร้าง User รหัส 4 หลัก</h3><div class="grid three"><label>รหัส 4 หลัก<input id="newCode" maxlength="4" inputmode="numeric" placeholder="1001"></label><label>ชื่อผู้ใช้งาน<input id="newName" placeholder="ชื่อเจ้าหน้าที่"></label><label>หน่วยงาน<input id="newDept" placeholder="ไม่บังคับ"></label></div><p><button class="btn" onclick="addUser()">บันทึก User</button></p></div>`+`<div class="table"><table><thead><tr><th>รหัส</th><th>ชื่อ</th><th>หน่วยงาน</th><th></th></tr></thead><tbody>${state.users.map((u,i)=>`<tr><td><b>${esc(u.code)}</b></td><td>${esc(u.name)}</td><td>${esc(u.department||'')}</td><td><button class="btn d" onclick="delUser(${i})">ลบ</button></td></tr>`).join('')||'<tr><td colspan="4">ยังไม่มี User</td></tr>'}</tbody></table></div>`}
async function addUser(){try{const code=$('newCode').value.trim(),name=$('newName').value.trim();if(!/^\d{4}$/.test(code))throw Error('รหัสต้องเป็นตัวเลข 4 หลัก');if(!name)throw Error('กรุณากรอกชื่อ');if(state.users.some(u=>u.code===code))throw Error('รหัสนี้มีอยู่แล้ว');state.users.push({code,name,department:$('newDept').value.trim(),createdAt:new Date().toISOString()});await saveState();status('บันทึก User แล้ว');render()}catch(e){status(e.message,true)}}
async function delUser(i){if(!confirm('ลบ User นี้?'))return;state.users.splice(i,1);await saveState();render()}
function adminBooks(){return `<div class="card"><h3>เพิ่มเล่มใบเสร็จ</h3><div class="grid four"><label>เล่มที่<input id="bookNo" placeholder="2567A"></label><label>เริ่ม<input id="bookStart" type="number" value="1"></label><label>สิ้นสุด สูงสุด 500<input id="bookEnd" type="number" value="500"></label><label>เลขล่าสุด<input id="bookLatest" type="number" value="0"></label></div><p><button class="btn" onclick="addBook()">เพิ่มเล่ม</button></p></div><div class="table"><table><thead><tr><th>เล่ม</th><th>ช่วงเลข</th><th>ล่าสุด</th><th>สถานะ</th><th></th></tr></thead><tbody>${state.books.map((b,i)=>`<tr><td>${esc(b.bookNo)}</td><td>${b.start}-${b.end}</td><td>${b.latest}</td><td>${b.active&&!b.closed?'ใช้งาน':'ปิด'}</td><td><button class="btn s" onclick="setActiveBook(${i})">ใช้เล่มนี้</button> <button class="btn d" onclick="closeBook(${i})">ปิด</button></td></tr>`).join('')}</tbody></table></div>`}
async function addBook(){try{const b={bookNo:$('bookNo').value.trim(),start:+$('bookStart').value||1,end:Math.min(+$('bookEnd').value||500,500),latest:+$('bookLatest').value||0,active:false,closed:false};if(!b.bookNo)throw Error('กรุณากรอกเล่มที่');if(state.books.some(x=>x.bookNo===b.bookNo))throw Error('เล่มนี้มีอยู่แล้ว');state.books.push(b);await saveState();render()}catch(e){status(e.message,true)}}
async function setActiveBook(i){state.books.forEach((b,idx)=>b.active=idx===i);state.books[i].closed=false;await saveState();render()}async function closeBook(i){state.books[i].closed=true;state.books[i].active=false;await saveState();render()}
function adminLists(){return `<div class="grid two"><div class="card"><h3>ประเภทรายการรับเงิน</h3><textarea id="itemsBox">${state.paymentItems.join('\n')}</textarea><p><button class="btn" onclick="saveList('paymentItems','itemsBox')">บันทึก</button></p></div><div class="card"><h3>โครงการ</h3><textarea id="projectsBox">${state.projects.map(p=>p.name).join('\n')}</textarea><p><button class="btn" onclick="saveProjects()">บันทึก</button></p></div></div>`}
async function saveList(key,id){state[key]=$(id).value.split('\n').map(s=>s.trim()).filter(Boolean);await saveState();status('บันทึกแล้ว')}async function saveProjects(){state.projects=$('projectsBox').value.split('\n').map(name=>({name:name.trim(),active:true})).filter(p=>p.name);await saveState();status('บันทึกแล้ว')}
function renderUser(){const options=state.paymentItems.map(x=>`<option>${esc(x)}</option>`).join('');const projects=state.projects.filter(p=>p.active).map(p=>`<option>${esc(p.name)}</option>`).join('');$('userArea').innerHTML=`<div class="card no-print"><h3>ออกใบเสร็จรับเงิน</h3><div class="grid three"><label>วันที่<input id="rDate" type="date" value="${today()}"></label><label>ชื่อผู้ชำระเงิน<input id="payer" placeholder="ชื่อ-นามสกุล"></label><label>โครงการ<select id="project">${projects}</select></label></div><div class="grid three" style="margin-top:10px"><label>รายการ<select id="item">${options}</select></label><label>จำนวนเงิน<input id="amount" type="number" min="0" step="0.01"></label><label>วิธีชำระ<select id="method"><option>เงินสด</option><option>โอนเงิน</option><option>เช็ค</option></select></label></div><label style="margin-top:10px">รายละเอียดเพิ่มเติม<textarea id="detail"></textarea></label><p><button class="btn g" onclick="issueReceipt()">ออกใบเสร็จ</button></p></div>`+receiptTable(state.receipts.filter(r=>r.userCode===currentUser.code).slice().reverse(),false)}
async function issueReceipt(){try{const receipt={id:Date.now().toString(36)+Math.random().toString(36).slice(2,7),date:$('rDate').value,payer:$('payer').value.trim(),project:$('project').value,item:$('item').value,detail:$('detail').value.trim(),amount:+$('amount').value||0,method:$('method').value,status:'ปกติ',userCode:currentUser.code,userName:currentUser.name,createdAt:new Date().toISOString()};if(!receipt.payer)throw Error('กรุณากรอกชื่อผู้ชำระเงิน');if(receipt.amount<=0)throw Error('กรุณากรอกจำนวนเงิน');let issued;if(supa){const {data,error}=await supa.rpc('issue_receipt',{p_user_code:currentUser.code,p_receipt:receipt});if(error)throw error;issued=data.receipt;state=normalize(data.state)}else{issued=issueLocal(receipt);await saveState()}status('ออกใบเสร็จเลขที่ '+issued.bookNo+'/'+issued.receiptNo);printReceipt(issued);render()}catch(e){status(e.message,true)}}
function issueLocal(r){const b=state.books.find(x=>x.active&&!x.closed);if(!b)throw Error('ยังไม่มีเล่มใบเสร็จที่เปิดใช้งาน');const n=Math.max(+b.start||1,(+b.latest||0)+1);if(n>(+b.end||500)||n>500)throw Error('เล่มนี้ออกเลขครบแล้ว');b.latest=n;r.bookNo=b.bookNo;r.receiptNo=String(n).padStart(3,'0');state.receipts.push(r);return r}
function receiptTable(rows,admin){return `<div class="card"><h3>รายการใบเสร็จ</h3><div class="table"><table><thead><tr><th>วันที่</th><th>เลขที่</th><th>ผู้ชำระ</th><th>รายการ</th><th>จำนวนเงิน</th><th>สถานะ</th><th></th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.date)}</td><td>${esc(r.bookNo||'-')}/${esc(r.receiptNo||'-')}</td><td>${esc(r.payer)}</td><td>${esc(r.item)}<br><small>${esc(r.project||'')}</small></td><td class="amount">${money(r.amount)}</td><td><span class="pill ${r.status==='ยกเลิก'?'bad':''}">${esc(r.status||'ปกติ')}</span>${r.cancelReason?'<br><small>'+esc(r.cancelReason)+'</small>':''}</td><td><button class="btn s" onclick='printReceipt(${JSON.stringify(r).replace(/'/g,"&#39;")})'>พิมพ์</button> ${r.status==='ยกเลิก'?'':`<button class="btn d" onclick="openCancel('${esc(r.id)}')">ยกเลิก</button>`}</td></tr>`).join('')||'<tr><td colspan="7">ยังไม่มีข้อมูล</td></tr>'}</tbody></table></div></div>`}
function printReceipt(r){$('printArea').innerHTML=`<div class="card printable"><div class="row no-print"><button class="btn" onclick="window.print()">พิมพ์ใบเสร็จ</button><button class="btn s" onclick="$('printArea').innerHTML=''">ปิด</button></div><div class="receipt"><div class="head"><img src="university-logo.svg" style="width:70px"><h2>ใบเสร็จรับเงิน</h2><div>มหาวิทยาลัยเทคโนโลยีราชมงคลสุวรรณภูมิ</div><div>เล่มที่ ${esc(r.bookNo)} เลขที่ ${esc(r.receiptNo)} วันที่ ${esc(r.date)}</div></div><p>ได้รับเงินจาก <b>${esc(r.payer)}</b></p><p>โครงการ ${esc(r.project||'-')}</p><table><thead><tr><th>รายการ</th><th>จำนวนเงิน</th></tr></thead><tbody><tr><td>${esc(r.item)}<br>${esc(r.detail||'')}</td><td class="amount">${money(r.amount)}</td></tr><tr><th>รวม</th><th class="amount">${money(r.amount)}</th></tr></tbody></table><p>ผู้รับเงิน ${esc(r.userName||'')}</p>${r.status==='ยกเลิก'?'<h2 style="color:#c63030">ยกเลิก</h2><p>'+esc(r.cancelReason||'')+'</p>':''}</div></div>`;window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})}
function openCancel(id){cancelTarget=id;const r=state.receipts.find(x=>x.id===id);$('cancelText').textContent=r?`เล่ม ${r.bookNo} เลขที่ ${r.receiptNo}`:'';$('cancelReason').value='';$('cancelModal').classList.add('open')}function closeCancel(){$('cancelModal').classList.remove('open');cancelTarget=null}
async function confirmCancel(){try{const reason=$('cancelReason').value.trim();if(!reason)throw Error('กรุณาระบุเหตุผล');if(supa){const {data,error}=await supa.rpc('cancel_receipt',{p_receipt_id:cancelTarget,p_reason:reason,p_actor_code:role==='user'?currentUser.code:'',p_admin_username:role==='admin'?'admin':'',p_admin_password:role==='admin'?'9999':''});if(error)throw error;state=normalize(data.state)}else{const r=state.receipts.find(x=>x.id===cancelTarget);if(!r)throw Error('ไม่พบใบเสร็จ');r.status='ยกเลิก';r.cancelReason=reason;await saveState()}closeCancel();status('ยกเลิกแล้ว');render()}catch(e){status(e.message,true)}}
init();
</script>
</body>
